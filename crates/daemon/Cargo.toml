[package]
name = "cli-master-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "cli-masterd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base64 = "0.22"
cli-master-agents = { path = "../agents" }
cli-master-core = { path = "../core" }
cli-master-git = { path = "../git" }
cli-master-session = { path = "../session" }
cli-master-storage = { path = "../storage" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
