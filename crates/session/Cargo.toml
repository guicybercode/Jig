[package]
name = "cli-master-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.100"
cli-master-core = { path = "../core" }
nix = { version = "0.31.3", features = ["process", "signal"] }
parking_lot = "0.12.5"
portable-pty = "0.9.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync"] }

[dev-dependencies]
cli-master-core = { path = "../core" }
cli-master-git = { path = "../git" }
cli-master-storage = { path = "../storage" }
tempfile = "3"
