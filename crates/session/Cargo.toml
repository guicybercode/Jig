[package]
name = "cli-master-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "PTY session manager for CLI Master"

[dependencies]
cli-master-core = { path = "../core" }
nix = { version = "0.30.1", features = ["process", "signal"] }
portable-pty = "0.9.0"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
