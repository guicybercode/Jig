[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/agents",
  "crates/core",
  "crates/daemon",
  "crates/e2e",
  "crates/fake-agent",
  "crates/file-metadata",
  "crates/git",
  "crates/session",
  "crates/storage",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.2.0"
license = "MIT"
repository = "https://github.com/guicybercode/Jig"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
