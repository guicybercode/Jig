[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/core",
    "crates/storage",
    "crates/git",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
